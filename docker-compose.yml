services:
  postgres:
    image: postgres:15-alpine
    container_name: churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churnpass
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.11-slim
    container_name: churn_mlflow
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install 'mlflow>=2.8,<4' --quiet &&
      mlflow server --host 0.0.0.0 --port 5001
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts"
    ports:
      - "5001:5001"
    volumes:
      - ./mlruns:/mlflow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
